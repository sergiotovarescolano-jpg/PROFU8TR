# Alternativa a GitHub Pages: Netlify lee este archivo al conectar el repositorio.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El service worker y el manifest no se cachean, para que las actualizaciones lleguen enseguida.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Los archivos de assets/ llevan hash en el nombre: se pueden cachear para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
